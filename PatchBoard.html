<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PatchBoard</title>
<meta name="author" content="Jolan D. — github.com/PercyaDJ">
<meta name="description" content="PatchBoard — Zero-install HTML dashboard for EPO and WSUS CSV report consolidation. No server, no dependencies.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1e2d44;--surface:#273d58;--card:#223352;--border:#365470;
  --text:#e0eaf8;--muted:#8fb5d4;--dim:#4d7a9a;--accent:#3b82f6;
  --mono:'Consolas','Fira Code','Courier New',monospace;
  --sans:'Segoe UI','Helvetica Neue',Arial,sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
#app{padding:20px 24px;}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.header-left{display:flex;flex-direction:column;gap:4px;}
.title-row{display:flex;align-items:center;gap:10px;}
.bars{display:flex;gap:3px;}
.bar{width:3px;height:22px;border-radius:2px;}
h1{font-family:var(--mono);font-size:18px;font-weight:700;color:#f8fafc;letter-spacing:-0.01em;}
.sub{margin-left:22px;color:var(--muted);font-size:11px;}
.btn-reset{background:transparent;color:var(--muted);border:1px solid var(--border);
  padding:5px 12px;border-radius:5px;cursor:pointer;font-size:11px;font-family:var(--sans);}
.btn-reset:hover{color:var(--text);border-color:var(--dim);}
.dropzone{border:1px dashed var(--border);border-radius:8px;padding:28px;text-align:center;
  margin-bottom:16px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none;}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:#182f4a;}
.dropzone p{color:var(--muted);font-size:13px;line-height:2;}
.dropzone code{font-family:var(--mono);font-size:10px;color:var(--dim);}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px;}
.chip{border-radius:4px;padding:3px 9px;font-size:11px;font-family:var(--mono);color:var(--muted);}
.chip-wsus{background:var(--card);border:1px solid #1d4ed8;}
.chip-epo{background:var(--card);border:1px solid #166534;}
.chip-err{background:#420d0d;border:1px solid #7f1d1d;color:#f87171;}
.tw{color:#60a5fa;font-weight:700;}
.te{color:#4ade80;font-weight:700;}
.tn{color:var(--dim);}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.kpi{background:var(--card);border-radius:6px;padding:14px 16px;border:1px solid var(--border);}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.kpi-value{font-size:28px;font-weight:700;font-family:var(--mono);margin-top:5px;}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filters select{background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;border-radius:5px;font-size:12px;font-family:var(--sans);outline:none;cursor:pointer;}
#search-input{background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;border-radius:5px;font-size:12px;font-family:var(--sans);outline:none;
  flex:1;min-width:220px;}
#search-input::placeholder{color:var(--muted);}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:12px;}
.tab{background:none;border:none;padding:8px 16px;cursor:pointer;font-size:12px;
  font-family:var(--sans);font-weight:400;color:var(--muted);
  border-bottom:2px solid transparent;transition:color .1s;}
.tab.ta{color:#ef4444;border-bottom-color:#ef4444;font-weight:700;}
.tab.tw{color:#60a5fa;border-bottom-color:#60a5fa;font-weight:700;}
.tab.te{color:#4ade80;border-bottom-color:#4ade80;font-weight:700;}
.tc{padding:0 5px;border-radius:3px;font-family:var(--mono);font-size:11px;}
.wrap{overflow-x:auto;border-radius:6px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{padding:9px 12px;text-align:left;color:var(--muted);font-family:var(--sans);
  font-weight:600;border-bottom:1px solid var(--border);font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;
  background:var(--surface);position:sticky;top:0;z-index:1;}
thead th.th-wsus{border-top:2px solid #1d4ed855;color:#60a5fa88;}
thead th.th-epo{border-top:2px solid #16653455;color:#4ade8088;}
tbody tr:nth-child(even){background:var(--surface);}
tbody tr:nth-child(odd){background:var(--bg);}
tbody tr:hover{background:#182d43;}
td{padding:7px 12px;border-bottom:1px solid #2a3f5c;vertical-align:middle;}
.bdg{padding:1px 7px;border-radius:3px;font-weight:700;font-size:11px;font-family:var(--mono);}
.bs-w{background:#0c1f3d;color:#60a5fa;border:1px solid #1d4ed8;}
.bs-e{background:#052e16;color:#4ade80;border:1px solid #166534;}
.bst-ok {background:#052e16;color:#4ade80;border:1px solid #166534;}
.bst-nok{background:#2d1f00;color:#fbbf24;border:1px solid #92400e;}
.bst-ko {background:#2d0000;color:#f87171;border:1px solid #7f1d1d;}
.bst-nd {background:#1e2d44;color:#6b90ae;border:1px solid #2d4a63;}
.n0{color:var(--dim);font-family:var(--mono);}
.ni{background:#2d1f00;color:#fbbf24;border:1px solid #92400e;}
.nc{background:#2d0000;color:#f87171;border:1px solid #7f1d1d;}
.ns{background:#2d1200;color:#fb923c;border:1px solid #7c2d12;}
.nf{background:#1e0d2e;color:#c084fc;border:1px solid #4c1d95;}
.np{background:#001a2d;color:#38bdf8;border:1px solid #0c4a6e;}
/* pastille source dans table anomalies */
.src{display:flex;gap:3px;flex-wrap:wrap;}
.src-w{background:#0c1f3d;color:#60a5fa;border:1px solid #1d4ed8;padding:0 5px;border-radius:3px;font-size:10px;font-family:var(--mono);font-weight:700;}
.src-e{background:#1a0a2e;color:#c084fc;border:1px solid #4c1d95;padding:0 5px;border-radius:3px;font-size:10px;font-family:var(--mono);font-weight:700;}
.mono{font-family:var(--mono);}
.muted{color:var(--muted);}
.dim{color:var(--dim);}
.sm{font-size:11px;}
.empty{text-align:center;padding:48px;color:var(--dim);font-size:13px;}
.empty-state{text-align:center;margin-top:80px;color:var(--dim);font-size:13px;}
.footer{margin-top:20px;text-align:right;color:var(--dim);font-size:10px;font-family:var(--mono);}
.btn-mail{background:#1d4ed8;color:#fff;padding:4px 12px;border-radius:4px;
  text-decoration:none;font-size:11px;font-weight:600;white-space:nowrap;
  font-family:var(--sans);display:inline-block;}
.btn-mail:hover{background:#2563eb;}
/* séparateur de groupe de colonnes */
.col-sep{border-left:1px solid #1f2937 !important;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ─── PatchBoard ───────────────────────────────────────────────────────────────
// Auteur  : Jolan D. (PercyaDJ)
// Version : 2.0
// Licence : MIT — Copyright © 2026 Jolan D. Tous droits réservés.
//           Redistribution autorisée avec mention obligatoire de l'auteur original.
//           Usage commercial interdit sans accord explicite de l'auteur.
// Dépôt   : https://github.com/PercyaDJ/PatchBoard
//
// Zero-install, single-file dashboard for EPO and WSUS CSV report consolidation.
// Drop your CSV exports, get anomalies and mail actions instantly — no server, no deps.
// Works with any organization prefix. Adapt NAMING_CONVENTION.md to your own file pattern.
// ─────────────────────────────────────────────────────────────────────────────

// ─── CONFIG ──────────────────────────────────────────────────────────────────
const WCOLS = ['Not Installed','Critical','Security','Failed','Pending Reboot'];
const WCOL_LABELS = {'Not Installed':'Non inst.','Critical':'Critique','Security':'Sécurité','Failed':'Échec','Pending Reboot':'Reboot'};
const WCOL_FILTER = {'Not Installed':'Non installé','Critical':'Critique','Security':'Sécurité','Failed':'Échec','Pending Reboot':'Reboot en attente'};
const WCOL_CLASS  = {'Not Installed':'ni','Critical':'nc','Security':'ns','Failed':'nf','Pending Reboot':'np'};

const W_WORDING = {
  'Not Installed':(p,v)=>`${v} mise${v>1?'s':''} à jour non installée${v>1?'s':''} ${v>1?'ont été détectées':'a été détectée'} sur votre poste ${p}. Merci de procéder à leur installation dans les meilleurs délais.`,
  'Critical':     (p,v)=>`${v} mise${v>1?'s':''} à jour critique${v>1?'s':''} ${v>1?'sont en attente':'est en attente'} sur votre poste ${p}. Ces mises à jour sont essentielles pour la sécurité. Merci d'y remédier en urgence.`,
  'Security':     (p,v)=>`${v} mise${v>1?'s':''} à jour de sécurité ${v>1?'sont en attente':'est en attente'} sur votre poste ${p}. Merci de les installer dès que possible.`,
  'Failed':       (p,v)=>`${v} mise${v>1?'s':''} à jour ${v>1?'ont échoué':'a échoué'} lors de leur installation sur votre poste ${p}. Merci de contacter le support ou de relancer manuellement les mises à jour.`,
  'Pending Reboot':(p)=>`Votre poste ${p} nécessite un redémarrage pour finaliser l'installation de mises à jour. Merci de redémarrer votre machine dès que possible.`,
};

// ─── STATE ───────────────────────────────────────────────────────────────────
const S = {wsusData:[],epoData:[],loadedFiles:[],siteFilter:'ALL',alertFilter:'ALL',tab:'alerts',search:''};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function parseFn(name){
  // Pattern structuré : [PREFIXE]-Reporting-(WSUS|EPO)-Site-[CODE]
  // Le préfixe est ignoré — fonctionne avec n'importe quelle organisation.
  const m=name.match(/[^\\/-]*Reporting-(WSUS|EPO)-Site-([A-Z0-9]{2,6})/i);
  if(m)return{type:m[1].toUpperCase(),site:m[2].toUpperCase()};

  // Fallback permissif : WSUS ou EPO présent dans le nom + code site optionnel
  const typeM=name.match(/\b(WSUS|EPO)\b/i);
  const siteM=name.match(/[Ss]ite[-_]([A-Z0-9]{2,6})/i);
  if(typeM)return{type:typeM[1].toUpperCase(),site:siteM?siteM[1].toUpperCase():'SITE'};

  return null;
}
function wsusIssues(row){
  return WCOLS.map(c=>({col:c,val:parseInt(row[c],10)})).filter(({val})=>!isNaN(val)&&val>0);
}
function epoStatus(row){
  const s=String(row['Status']||'').trim().toLowerCase();
  // Valeurs exactes observées dans les exports
  if(s==='antivirus ok')return'ok';
  if(s==='antivirus nok')return'nok';
  if(s==='antivirus ko')return'ko';
  // Autres préfixes possibles selon le site
  if(s.endsWith(' ok'))return'ok';
  if(s.endsWith(' nok'))return'nok';
  if(s.endsWith(' ko'))return'ko';
  return null;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getSites(){
  return['ALL',...[...new Set([...S.wsusData,...S.epoData].map(r=>r._site).filter(Boolean))].sort()];
}
function matchSearch(poste,user){
  const q=S.search.toLowerCase().trim();
  if(!q)return true;
  return String(poste||'').toLowerCase().includes(q)||String(user||'').toLowerCase().includes(q);
}

// ─── JOINTURE PAR POSTE ──────────────────────────────────────────────────────
// Retourne une liste de lignes consolidées, une par poste en anomalie.
// Chaque ligne a : poste, user, site, wsusRow (ou null), epoRow (ou null)
function buildMerged(){
  // Index WSUS par nom de poste normalisé
  const wsusIdx={};
  for(const r of S.wsusData){
    const key=(String(r['Poste']||'')).toUpperCase().trim();
    if(key)wsusIdx[key]=r;
  }
  // Index EPO par nom de poste normalisé
  const epoIdx={};
  for(const r of S.epoData){
    const key=(String(r['Poste']||'')).toUpperCase().trim();
    if(key)epoIdx[key]=r;
  }

  // Union des clés
  const allKeys=new Set([...Object.keys(wsusIdx),...Object.keys(epoIdx)]);
  const rows=[];

  for(const key of allKeys){
    const w=wsusIdx[key]||null;
    const e=epoIdx[key]||null;

    const hasWsusAlert = w && wsusIssues(w).length>0;
    const hasEpoAlert  = e && epoStatus(e)!=='ok' && epoStatus(e)!==null;

    if(!hasWsusAlert&&!hasEpoAlert)continue;

    // Filtrage site
    const site=(w||e)._site;
    if(S.siteFilter!=='ALL'&&site!==S.siteFilter)continue;

    // Filtrage type anomalie (uniquement WSUS cols)
    if(S.alertFilter!=='ALL'){
      if(!w)continue;
      const iss=wsusIssues(w);
      if(!iss.some(i=>i.col===S.alertFilter))continue;
    }

    const poste=(w||e)['Poste']||key;
    const user =(w||e)['User']||'';
    if(!matchSearch(poste,user))continue;

    rows.push({poste,user,site,w,e,hasWsusAlert,hasEpoAlert});
  }
  return rows;
}

// ─── MAILTO CONSOLIDÉ ────────────────────────────────────────────────────────
function buildMailto(merged){
  const {poste,user,w,e,hasWsusAlert,hasEpoAlert}=merged;
  const sub='[SECURITE] Action requise - Poste '+poste;

  const lines=[];

  if(hasEpoAlert&&e){
    const st=String(e['Status']||'');
    if(st.toUpperCase()==='NOK'){
      lines.push(`  - Une anomalie a été détectée sur la protection antivirus (Endpoint Security) de votre poste. Le statut actuel est : ${st}. Merci de vérifier que l'antivirus est bien actif et à jour, et de contacter le support si le problème persiste.`);
    } else {
      lines.push(`  - L'antivirus de votre poste est dans un état non conforme (${st}). Merci de contacter immédiatement l'équipe SSI pour régulariser la situation.`);
    }
  }

  if(hasWsusAlert&&w){
    const iss=wsusIssues(w);
    for(const {col,val} of iss){
      lines.push('  - '+W_WORDING[col](poste,val));
    }
  }

  const body=[
    'Bonjour,','',
    'Nous vous contactons au sujet de votre poste de travail : '+poste+'.',
    '','Les anomalies suivantes ont été détectées lors de notre contrôle hebdomadaire :','',
    ...lines,'',
    'Merci de prendre en compte ces actions dans les meilleurs délais.',
    "En cas de difficulté, n'hésitez pas à contacter l'équipe SSI.",
    '','Cordialement,',"L'équipe Sécurité des Systèmes d'Information",
  ].join('\n');

  return'mailto:'+user+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);
}

// ─── HTML BUILDERS ───────────────────────────────────────────────────────────
function hKpis(wsusFiltered,epoFiltered,merged,tab){
  let k=[];

  if(tab==='alerts'){
    // KPI généraux : vue Codir / CoSite
    const totalPostes=new Set([...wsusFiltered.map(r=>String(r['Poste']||'').toUpperCase()),...epoFiltered.map(r=>String(r['Poste']||'').toUpperCase())]).size;
    const wsusAnomaly=merged.filter(m=>m.hasWsusAlert).length;
    const epoAnomaly =merged.filter(m=>m.hasEpoAlert).length;
    const both       =merged.filter(m=>m.hasWsusAlert&&m.hasEpoAlert).length;
    k=[
      {l:'Postes en anomalie',       v:merged.length, c:'#f87171', s:totalPostes?`sur ${totalPostes} postes surveillés`:''},
      {l:'Anomalies WSUS',           v:wsusAnomaly,   c:'#60a5fa', s:wsusFiltered.length?((wsusAnomaly/wsusFiltered.length)*100).toFixed(0)+'% du parc':''},
      {l:'Anomalies EPO (antivirus)',v:epoAnomaly,    c:'#c084fc', s:epoFiltered.length?((epoAnomaly/epoFiltered.length)*100).toFixed(0)+'% du parc':''},
      {l:'Double anomalie EPO+WSUS', v:both,           c:'#fb923c', s:both>0?'postes à traiter en priorité':''},
    ];
  } else if(tab==='wsus'){
    const nc =wsusFiltered.filter(r=>wsusIssues(r).length>0).length;
    const cr =wsusFiltered.filter(r=>parseInt(r['Critical'],10)>0).length;
    const rb =wsusFiltered.filter(r=>parseInt(r['Pending Reboot'],10)>0).length;
    const fa =wsusFiltered.filter(r=>parseInt(r['Failed'],10)>0).length;
    const pct=wsusFiltered.length?((nc/wsusFiltered.length)*100).toFixed(0):0;
    k=[
      {l:'Postes WSUS analysés',     v:wsusFiltered.length, c:'#60a5fa', s:''},
      {l:'Non conformes',            v:nc,                  c:'#fbbf24', s:wsusFiltered.length?pct+'% du parc':''},
      {l:'Patchs critiques en attente',v:cr,                c:'#f87171', s:''},
      {l:'Reboot en attente',        v:rb,                  c:'#38bdf8', s:fa?`${fa} échec${fa>1?'s':''} d'installation`:''},
    ];
  } else if(tab==='epo'){
    const ok  =epoFiltered.filter(r=>epoStatus(r)==='ok').length;
    const nok =epoFiltered.filter(r=>epoStatus(r)==='nok').length;
    const ko  =epoFiltered.filter(r=>epoStatus(r)==='ko').length;
    const nd  =epoFiltered.filter(r=>epoStatus(r)===null).length;
    const pctOk=epoFiltered.length?((ok/epoFiltered.length)*100).toFixed(0):0;
    k=[
      {l:'Postes EPO analysés',      v:epoFiltered.length, c:'#60a5fa', s:''},
      {l:'Antivirus OK',             v:ok,                 c:'#4ade80', s:epoFiltered.length?pctOk+'% du parc':''},
      {l:'Antivirus NOK',            v:nok,                c:'#fbbf24', s:'anomalie à corriger'},
      {l:'Antivirus KO',             v:ko,                 c:'#f87171', s:nd?`${nd} statut${nd>1?'s':''} inconnu${nd>1?'s':''}`:''},
    ];
  }

  return`<div class="kpi-grid">${k.map(x=>`<div class="kpi" style="border-left:3px solid ${x.c}"><div class="kpi-label">${x.l}</div><div class="kpi-value" style="color:${x.c}">${x.v}</div>${x.s?`<div class="kpi-sub">${x.s}</div>`:''}</div>`).join('')}</div>`;
}

function hFilters(){
  const so=getSites().map(s=>`<option value="${s}"${S.siteFilter===s?' selected':''}>${s==='ALL'?'Tous les sites':'Site - '+s}</option>`).join('');
  const ao=`<option value="ALL"${S.alertFilter==='ALL'?' selected':''}>Toutes les anomalies</option>`
    +WCOLS.map(c=>`<option value="${c}"${S.alertFilter===c?' selected':''}>${WCOL_FILTER[c]}</option>`).join('');
  return`<div class="filters">
    <select onchange="set('siteFilter',this.value)">${so}</select>
    <select onchange="set('alertFilter',this.value)">${ao}</select>
    <input id="search-input" type="text" placeholder="Rechercher un poste ou un GID..." value="${esc(S.search)}" oninput="onSearch(this.value)">
  </div>`;
}

function hTabs(ca,cw,ce){
  return`<div class="tabs">
    <button class="tab${S.tab==='alerts'?' ta':''}" onclick="set('tab','alerts')">Anomalies <span class="tc" style="color:${S.tab==='alerts'?'#ef4444':'var(--dim)'};background:${S.tab==='alerts'?'#ef444422':'transparent'}">${ca}</span></button>
    <button class="tab${S.tab==='wsus'?' tw':''}" onclick="set('tab','wsus')">WSUS complet <span class="tc" style="color:${S.tab==='wsus'?'#60a5fa':'var(--dim)'};background:${S.tab==='wsus'?'#60a5fa22':'transparent'}">${cw}</span></button>
    <button class="tab${S.tab==='epo'?' te':''}" onclick="set('tab','epo')">EPO <span class="tc" style="color:${S.tab==='epo'?'#4ade80':'var(--dim)'};background:${S.tab==='epo'?'#4ade8022':'transparent'}">${ce}</span></button>
  </div>`;
}

function hNumCell(col,val,addSep){
  const sep=addSep?'col-sep':'';
  if(isNaN(val)||val===0)return`<td class="${sep}"><span class="n0">0</span></td>`;
  return`<td class="${sep}"><span class="bdg ${WCOL_CLASS[col]}">${val}</span></td>`;
}

function hEpoCell(epoRow,addSep){
  const sep=addSep?'col-sep':'';
  if(!epoRow)return`<td class="${sep}"><span class="bdg bst-nd">N/A</span></td>`;
  const st=epoStatus(epoRow);
  const cls=st==='ok'?'bst-ok':st==='nok'?'bst-nok':'bst-ko';
  return`<td class="${sep}"><span class="bdg ${cls}">${esc(epoRow['Status']||'-')}</span></td>`;
}

// Table anomalies : UNE seule table, UNE ligne par poste, UN bouton mail
function hAlerts(mergedRows){
  if(!mergedRows.length)return`<div class="empty">Aucune anomalie détectée avec les filtres actuels.</div>`;

  // En-têtes avec séparation visuelle entre groupes EPO / WSUS
  const head=`<thead><tr>
    <th>Site</th>
    <th>Poste</th>
    <th>Utilisateur</th>
    <th>Sources</th>
    <th class="th-epo col-sep">Antivirus</th>
    ${WCOLS.map((c,i)=>`<th class="th-wsus${i===0?' col-sep':''}">${WCOL_LABELS[c]}</th>`).join('')}
    <th class="col-sep">Action</th>
  </tr></thead>`;

  const body=mergedRows.map(m=>{
    const sources=`<div class="src">${m.hasEpoAlert?'<span class="src-e">EPO</span>':''}${m.hasWsusAlert?'<span class="src-w">WSUS</span>':''}</div>`;
    const wVals=WCOLS.map((c,i)=>{
      const val=m.w?parseInt(m.w[c],10):NaN;
      return hNumCell(c,val,i===0);
    }).join('');
    return`<tr>
      <td><span class="bdg bs-w">${esc(m.site)}</span></td>
      <td class="mono sm" style="color:#cbd5e1">${esc(m.poste)}</td>
      <td class="mono muted sm">${esc(m.user)}</td>
      <td>${sources}</td>
      ${hEpoCell(m.e,true)}
      ${wVals}
      <td class="col-sep"><a class="btn-mail" href="${buildMailto(m)}">Envoyer mail</a></td>
    </tr>`;
  }).join('');

  return`<div class="wrap"><table>${head}<tbody>${body}</tbody></table></div>`;
}

function hWsus(rows){
  if(!rows.length)return`<div class="empty">Aucune ligne ne correspond aux filtres.</div>`;
  const ths=['Site','Poste','Utilisateur','OS',...WCOLS.map(c=>WCOL_LABELS[c]),'Dernière sync'].map(h=>`<th>${h}</th>`).join('');
  const trs=rows.map(row=>{
    const os=String(row['Operating System']||'').replace('Microsoft Windows ','Win ');
    return`<tr>
      <td><span class="bdg bs-w">${esc(row._site)}</span></td>
      <td class="mono sm" style="color:#cbd5e1">${esc(row['Poste'])}</td>
      <td class="mono muted sm">${esc(row['User'])}</td>
      <td class="dim sm">${esc(os)}</td>
      ${WCOLS.map(c=>hNumCell(c,parseInt(row[c],10),false)).join('')}
      <td class="dim sm mono">${esc(row['Last Sync Time'])}</td></tr>`;
  }).join('');
  return`<div class="wrap"><table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

function hEpoTable(rows){
  if(!rows.length)return`<div class="empty">Aucune donnée EPO chargée.</div>`;
  const ths=['Site','Poste','Status','Dernier contact','EP Threat Prevention','Agent','Type','Utilisateur','Action'].map(h=>`<th>${h}</th>`).join('');
  const trs=rows.map(row=>{
    const st=epoStatus(row);
    const isAlert=st!=='ok'&&st!==null;
    const cls=st==='ok'?'bst-ok':st==='nok'?'bst-nok':st==='ko'?'bst-ko':'bst-nd';
    const ml=isAlert?('mailto:'+row['User']+'?subject='+encodeURIComponent('[SECURITE] Action requise - Poste '+row['Poste']+' (antivirus)')+'&body='+encodeURIComponent(
      ['Bonjour,','','Nous vous contactons au sujet de votre poste de travail : '+row['Poste']+'.',
      '',`Le statut de l'antivirus Endpoint Security sur votre poste est actuellement : ${row['Status']}.`,'',
      st==='nok'?"Une anomalie a été détectée sur la protection antivirus. Merci de vérifier que l'antivirus est bien actif et à jour."
               :"L'antivirus de votre poste est dans un état non conforme (KO). Merci de contacter immédiatement l'équipe SSI.",
      '','Merci de prendre en compte cette action dans les meilleurs délais.',
      "En cas de difficulté, n'hésitez pas à contacter l'équipe SSI.",
      '','Cordialement',"L'équipe Sécurité des Systèmes d'Information"].join('\n')
    )):'';
    return`<tr>
      <td><span class="bdg bs-e">${esc(row._site)}</span></td>
      <td class="mono sm" style="color:#cbd5e1">${esc(row['Poste'])}</td>
      <td><span class="bdg ${cls}">${esc(row['Status']||'-')}</span></td>
      <td class="dim sm mono">${esc(row['Last Contact'])}</td>
      <td class="muted sm">${esc(row['Endpoint Security Threat Prevention'])}</td>
      <td class="muted sm">${esc(row['Agent'])}</td>
      <td class="muted">${esc(row['Type'])}</td>
      <td class="mono muted sm">${esc(row['User'])}</td>
      <td>${ml?`<a class="btn-mail" href="${ml}">Envoyer mail</a>`:''}</td></tr>`;
  }).join('');
  return`<div class="wrap"><table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

function hChips(){
  if(!S.loadedFiles.length)return'';
  return`<div class="chips">${S.loadedFiles.map(f=>{
    if(f.status==='err')return`<div class="chip chip-err">${esc(f.name.substring(0,30))}... erreur</div>`;
    const tc=f.type==='WSUS'?'tw':'te',cc=f.type==='WSUS'?'chip-wsus':'chip-epo';
    return`<div class="chip ${cc}"><span class="${tc}">${f.type}</span> ${f.site} <span class="tn">(${f.n})</span></div>`;
  }).join('')}</div>`;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render(){
  const siteW  = S.wsusData.filter(r=>S.siteFilter==='ALL'||r._site===S.siteFilter);
  const siteE  = S.epoData.filter(r=>S.siteFilter==='ALL'||r._site===S.siteFilter);
  const merged = buildMerged();
  const allW   = S.wsusData.filter(r=>{
    if(S.siteFilter!=='ALL'&&r._site!==S.siteFilter)return false;
    return matchSearch(r['Poste'],r['User']);
  });
  const allE   = S.epoData.filter(r=>{
    if(S.siteFilter!=='ALL'&&r._site!==S.siteFilter)return false;
    return matchSearch(r['Poste'],r['User']);
  });
  const hasData=S.wsusData.length>0||S.epoData.length>0;
  const date   =new Date().toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  let table='';
  if(S.tab==='alerts')table=hAlerts(merged);
  else if(S.tab==='wsus')table=hWsus(allW);
  else table=hEpoTable(allE);

  // Sauvegarde curseur
  const si=document.getElementById('search-input');
  const ss=si?si.selectionStart:null,se=si?si.selectionEnd:null;

  document.getElementById('app').innerHTML=`
    <div class="header">
      <div class="header-left">
        <div class="title-row">
          <div class="bars">
            <div class="bar" style="background:#2563eb"></div>
            <div class="bar" style="background:#10b981"></div>
          </div>
          <h1>PatchBoard</h1>
        </div>
        <div class="sub">Consolidation EPO + WSUS &bull; ${date}</div>
      </div>
      ${S.loadedFiles.length?`<button class="btn-reset" onclick="resetAll()">Réinitialiser</button>`:''}
    </div>
    <div class="dropzone" id="dz" onclick="document.getElementById('fi').click()">
      <input id="fi" type="file" multiple accept=".csv" style="display:none" onchange="loadFiles(this.files);this.value='';">
      <p>Déposez vos fichiers CSV ici ou cliquez pour sélectionner<br>
        <code>[PREFIX]-Reporting-EPO-Site-XXX_*.csv &nbsp;&bull;&nbsp; [PREFIX]-Reporting-WSUS-Site-XXX_*.csv</code>
      </p>
    </div>
    ${hChips()}
    ${hasData?hKpis(siteW,siteE,merged,S.tab):''}
    ${hasData?hFilters():''}
    ${hasData?hTabs(merged.length,allW.length,allE.length):''}
    ${hasData?table:''}
    ${!hasData&&!S.loadedFiles.length?`<div class="empty-state"><p>Aucun fichier chargé. Déposez vos exports CSV pour commencer.</p></div>`:''}
    ${hasData?`<div class="footer">${S.wsusData.length} postes WSUS &bull; ${S.epoData.length} postes EPO &bull; ${S.loadedFiles.length} fichiers chargés</div>`:''}
    <div class="footer" style="margin-top:4px">PatchBoard &copy; 2026 <a href="https://github.com/PercyaDJ/PatchBoard" target="_blank" style="color:var(--dim);text-decoration:none;">Jolan D.</a> &bull; MIT License</div>
  `;

  // Restaure focus/curseur
  const ni=document.getElementById('search-input');
  if(ni&&ss!==null){ni.focus();try{ni.setSelectionRange(ss,se);}catch(e){}}

  const dz=document.getElementById('dz');
  if(dz){
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
    dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');loadFiles(e.dataTransfer.files);});
  }
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function set(k,v){S[k]=v;render();}
function onSearch(v){S.search=v;render();}
function resetAll(){
  S.wsusData=[];S.epoData=[];S.loadedFiles=[];
  S.siteFilter='ALL';S.alertFilter='ALL';S.search='';S.tab='alerts';
  render();
}
function loadFiles(files){
  const arr=Array.from(files);let pending=arr.length;if(!pending)return;
  arr.forEach(file=>{
    const meta=parseFn(file.name);
    if(!meta){S.loadedFiles.push({name:file.name,status:'err'});if(--pending===0)render();return;}
    Papa.parse(file,{
      header:true,skipEmptyLines:true,
      complete({data}){
        const rows=data.map(r=>({...r,_site:meta.site}));
        if(meta.type==='WSUS')S.wsusData.push(...rows);
        else S.epoData.push(...rows);
        S.loadedFiles.push({name:file.name,type:meta.type,site:meta.site,n:data.length,status:'ok'});
        if(--pending===0)render();
      },
      error(){S.loadedFiles.push({name:file.name,status:'err'});if(--pending===0)render();}
    });
  });
}

render();
</script>
</body>
